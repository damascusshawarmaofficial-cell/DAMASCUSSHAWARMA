<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Damascus Shawarma</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- Hidden form definition so Netlify can detect the React form -->
    <form
      name="catering-request"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catering-request" />

      <p>
        <label>
          Leave this field empty:
          <input name="bot-field" />
        </label>
      </p>

      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="event-date" />
      <input name="guest-count" />
      <input name="event-type" />
      <textarea name="details"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
