<body>
  <div id="root"></div>

  <!-- Hidden form definition for Netlify -->
  <form
    name="catering-request"
    method="POST"
    data-netlify="true"
    netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="catering-request" />

    <p>
      <label>
        Leave this field empty:
        <input name="bot-field" />
      </label>
    </p>

    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <input name="event-date" />
    <input name="guest-count" />
    <input name="event-type" />
    <textarea name="details"></textarea>
  </form>

  <script type="module" src="/src/main.tsx"></script>
</body>
